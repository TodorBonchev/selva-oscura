<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selva Oscura</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #0b0f0c;
      color: #d7e0d4;
    }
    main {
      max-width: 36rem;
      padding: 2rem;
      text-align: center;
      border: 1px solid #2a3a2e;
      border-radius: 8px;
      background: #121a14;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #e8f0e4;
    }
    p { margin: 0.5rem 0; line-height: 1.5; color: #a8b5a6; }
    .note { font-size: 0.9rem; color: #7f8f7c; }
  </style>
</head>
<body>
  <main>
    <h1>Selva Oscura — coming soon</h1>
    <p>Browser client placeholder for the playable site.</p>
    <p class="note">The authoritative game server will be hosted separately (not on this Vercel project).</p>
  </main>
</body>
</html>
