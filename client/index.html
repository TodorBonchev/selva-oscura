<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selva Oscura</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="hud">
    <header>
      <h1>Selva Oscura</h1>
      <div id="canto-title">Connecting…</div>
    </header>
    <div id="stats">
      <span id="hp">HP —</span>
      <span id="ash">Ash —</span>
      <span id="pending">Pending —</span>
    </div>
    <div id="toast"></div>
    <div id="help">
      Click ground to move · Click foe to attack · E / click POI to interact · I inventory · A AH
    </div>
  </div>
  <div id="panels">
    <aside id="inventory" class="panel hidden">
      <h2>Inventory</h2>
      <ul id="inv-list"></ul>
      <p class="hint">Select an item, set Ash price, List on AH.</p>
      <div class="row">
        <input id="list-price" type="number" min="1" step="1" placeholder="Price Ash" />
        <button id="btn-list" type="button">List</button>
      </div>
    </aside>
    <aside id="ah" class="panel hidden">
      <h2>Auction House</h2>
      <ul id="ah-list"></ul>
      <button id="btn-ah-refresh" type="button">Refresh</button>
    </aside>
  </div>
  <div id="game-root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
